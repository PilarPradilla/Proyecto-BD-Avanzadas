<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Sabrosometro | Restaurantes', 'restaurantes', ~{::section})}">
<body>
<section>
<style>
  .chip[aria-pressed="true"] { background:#111827; color:#fff; border-color:#111827; }
  .chip:focus-visible { outline:2px solid #6366f1; outline-offset:2px; }
  #panel { transition: opacity .15s ease, transform .15s ease; }
  #panel.hidden-panel { opacity:0; transform:translateY(-6px); pointer-events:none; visibility:hidden; }
  @media (prefers-reduced-motion: reduce) { #panel { transition:none; } }
</style>

<div class="max-w-4xl mx-auto">
    <h1 class="text-5xl font-semibold text-gray-800 my-8 text-center">Restaurantes</h1>

    <!-- Barra de búsqueda -->
    <div id="buscador" class="relative w-full max-w-3xl mx-auto mb-6">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </span>
        <input id="busqueda" type="text" autocomplete="off"
            placeholder="Busca un restaurante..."
            aria-expanded="false" aria-controls="panel"
            class="w-full pl-11 pr-28 py-3 bg-white border border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent shadow-sm transition">
        <button id="limpiar" type="button"
            class="hidden absolute inset-y-0 right-3 my-auto h-8 px-3 text-sm rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition">
            Limpiar (<span id="contador">0</span>)
        </button>
        <div id="panel" role="region" aria-label="Filtros"
            class="hidden-panel absolute left-0 right-0 top-full mt-2 z-20 bg-white border border-gray-200 rounded-2xl shadow-xl p-6 max-h-[70vh] overflow-y-auto">
            <div class="space-y-6" id="grupos"></div>
        </div>
    </div>

    <!-- Solo administrador (se muestra con JS) -->
    <div id="bloqueAdmin" class="hidden">
        <div class="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
            <h2 class="text-xl font-semibold">¿Deseas añadir algún restaurante nuevo?</h2>
            <button id="agregar" class="inline-block mt-4 bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-lg shadow-lg">Añadir</button>
        </div>

        <!-- Ventana emergente -->
        <div id="ventana-agregar" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-[4px] p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-xl overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-utensils"></i> Añadir nuevo restaurante
                    </h2>
                    <button id="cerrar-ventana-agregar" type="button" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-200/60 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <form id="formAgregar" class="p-6 space-y-4">
                    <div id="errorAgregar" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2 rounded-lg"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nombre</label>
                            <input type="text" id="f-nombre" placeholder="Ej. Doña Inés" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Tipo de comida</label>
                            <input type="text" id="f-tipo" placeholder="Ej. Típica / Italiana" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                        </div>
                        <div class="col-span-1 sm:col-span-2 space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Dirección</label>
                            <input type="text" id="f-direccion" placeholder="Ej. Calle 45 # 12-30" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Zona</label>
                            <input type="text" id="f-zona" placeholder="Ej. Chapinero" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Teléfono <span class="text-gray-400 font-normal">(Opcional)</span></label>
                            <input type="text" id="f-telefono" placeholder="Ej. 3101234567" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Apertura</label>
                            <input type="time" id="f-apertura" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition text-gray-600">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Cierre</label>
                            <input type="time" id="f-cierre" required class="w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500 transition text-gray-600">
                        </div>
                    </div>
                    <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
                        <button type="button" id="cerrar" class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-100 text-sm font-medium transition">Cancelar</button>
                        <button type="submit" class="px-6 py-2.5 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold rounded-xl shadow-md transition">Guardar restaurante</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Aquí se pintan las tarjetas -->
    <div id="lista"></div>
</div>

<script>
(function () {
  // Usuario en sesión (nombre distinto al de base.html para no chocar)
  let sesion = null;
  try { sesion = JSON.parse(sessionStorage.getItem('usuario')); } catch (e) {}
  const soyAdmin = !!sesion && sesion.rol === 'administrador';

  const input      = document.getElementById('busqueda');
  const panel      = document.getElementById('panel');
  const caja       = document.getElementById('buscador');
  const limpiar    = document.getElementById('limpiar');
  const contGrupos = document.getElementById('grupos');
  const lista      = document.getElementById('lista');

  // grupo del filtro -> campo del restaurante
  const CAMPOS = { 'Tipo de comida': 'tipoComida', 'Zona': 'zona' };
  const seleccion = {};

  // ── Panel de filtros ──
  const abrir  = () => { panel.classList.remove('hidden-panel'); input.setAttribute('aria-expanded', 'true'); };
  const cerrarPanel = () => { panel.classList.add('hidden-panel'); input.setAttribute('aria-expanded', 'false'); };
  input.addEventListener('focus', abrir);
  input.addEventListener('click', abrir);
  document.addEventListener('mousedown', e => { if (!caja.contains(e.target)) cerrarPanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarPanel(); input.blur(); } });

  // ── Cargar restaurantes desde la API ──
  async function cargar() {
    try {
      const res = await fetch('/restaurantes');
      if (!res.ok) throw new Error(res.status);
      const datos = await res.json();
      pintar(datos);
      construirChips(datos);
    } catch (err) {
      console.error(err);
      lista.innerHTML = '<p class="text-center text-gray-500">No se pudieron cargar los restaurantes.</p>';
    }
  }

  function pintar(restaurantes) {
    lista.innerHTML = '';
    if (restaurantes.length === 0) {
      lista.innerHTML = '<p class="text-center text-gray-500">Aún no hay restaurantes.</p>';
      return;
    }
    restaurantes.forEach(r => {
      const a = document.createElement('a');
      a.href = '/restaurante/' + r.idRestaurante;
      a.className = 'restaurante block';
      a.dataset.nombre = (r.nombre || '').toLowerCase();
      a.dataset.tipoComida = r.tipoComida || '';
      a.dataset.zona = r.zona || '';

      a.innerHTML =
        '<div class="w-full flex flex-wrap my-8 bg-gray-50 rounded-xl">' +
          '<div class="relative w-2/5 rounded-xl">' +
            '<button type="button" aria-label="Guardar en favoritos" class="fav absolute top-3 left-3 z-30 flex items-center justify-center w-9 h-9 rounded-full bg-white/90 text-gray-400 hover:text-red-500 shadow transition">' +
              '<i class="fa-solid fa-heart"></i></button>' +
            '<img class="rounded-xl w-full" alt="" src="https://th.bing.com/th/id/R.ec6bf82064d04642edacc92026c44f1c?rik=1iFxq0nAIXuesA&pid=ImgRaw&r=0">' +
          '</div>' +
          '<div class="m-8">' +
            '<h3 class="text-xl font-bold t-nombre"></h3>' +
            '<p class="t-tipo"></p><p class="t-dir"></p><p class="t-zona text-gray-500"></p>' +
            '<p class="t-promedio text-sm text-gray-600 mt-1"></p>' +
          '</div>' +
        '</div>';

      // textContent evita inyección de HTML
      a.querySelector('.t-nombre').textContent = r.nombre;
      a.querySelector('.t-tipo').textContent = r.tipoComida;
      a.querySelector('.t-dir').textContent = r.direccion;
      a.querySelector('.t-zona').textContent = r.zona;
      a.querySelector('.t-promedio').textContent =
        '★ ' + Number(r.promedioGeneral).toFixed(1) + ' (' + r.totalCalificaciones + ')';

      const fav = a.querySelector('.fav');
      if (soyAdmin) fav.remove();
      else fav.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });

      lista.appendChild(a);
    });
  }

  // ── Chips construidos con los datos cargados ──
  function construirChips(restaurantes) {
    contGrupos.innerHTML = '';
    for (const [grupo, campo] of Object.entries(CAMPOS)) {
      const opciones = [...new Set(restaurantes.map(r => r[campo]).filter(Boolean))].sort();
      seleccion[grupo] = new Set();
      const sec = document.createElement('div');
      sec.innerHTML = '<h3 class="text-sm font-semibold text-gray-800 mb-3"></h3><div class="flex flex-wrap gap-2"></div>';
      sec.querySelector('h3').textContent = grupo;
      const fila = sec.querySelector('div');
      opciones.forEach(op => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = op;
        b.setAttribute('aria-pressed', 'false');
        b.className = 'chip px-4 py-1.5 text-sm rounded-full border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 transition';
        b.addEventListener('click', () => {
          const activo = b.getAttribute('aria-pressed') === 'true';
          b.setAttribute('aria-pressed', String(!activo));
          activo ? seleccion[grupo].delete(op) : seleccion[grupo].add(op);
          actualizar();
        });
        fila.appendChild(b);
      });
      contGrupos.appendChild(sec);
    }
  }

  function actualizar() {
    const total = Object.values(seleccion).reduce((n, s) => n + s.size, 0);
    document.getElementById('contador').textContent = total;
    limpiar.classList.toggle('hidden', total === 0);
    buscar();
  }

  limpiar.addEventListener('click', () => {
    Object.values(seleccion).forEach(s => s.clear());
    panel.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    actualizar();
  });

  input.addEventListener('input', buscar);

  function buscar() {
    const texto = input.value.trim().toLowerCase();
    document.querySelectorAll('.restaurante').forEach(card => {
      const okTexto = !texto
        || card.dataset.nombre.includes(texto)
        || card.dataset.tipoComida.toLowerCase().includes(texto)
        || card.dataset.zona.toLowerCase().includes(texto);
      let okFiltros = true;
      for (const [grupo, campo] of Object.entries(CAMPOS)) {
        const sel = seleccion[grupo];
        if (sel && sel.size > 0) {
          const clave = campo === 'tipoComida' ? 'tipoComida' : 'zona';
          if (!sel.has(card.dataset[clave])) okFiltros = false;
        }
      }
      card.classList.toggle('hidden', !(okTexto && okFiltros));
    });
  }

  // ── Añadir restaurante (solo admin) ──
  if (soyAdmin) {
    document.getElementById('bloqueAdmin').classList.remove('hidden');
    const ventana = document.getElementById('ventana-agregar');
    const errorBox = document.getElementById('errorAgregar');
    const abrirVentana  = () => { ventana.classList.remove('hidden'); ventana.classList.add('flex'); };
    const cerrarVentana = () => { ventana.classList.add('hidden'); ventana.classList.remove('flex'); errorBox.classList.add('hidden'); };

    document.getElementById('agregar').addEventListener('click', abrirVentana);
    document.getElementById('cerrar-ventana-agregar').addEventListener('click', cerrarVentana);
    document.getElementById('cerrar').addEventListener('click', cerrarVentana);

    document.getElementById('formAgregar').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      const tel = document.getElementById('f-telefono').value.trim();
      const body = {
        idDueno: null,
        nombre: document.getElementById('f-nombre').value.trim(),
        tipoComida: document.getElementById('f-tipo').value.trim(),
        direccion: document.getElementById('f-direccion').value.trim(),
        zona: document.getElementById('f-zona').value.trim(),
        telefono: tel === '' ? null : tel,
        horaApertura: document.getElementById('f-apertura').value + ':00',
        horaCierre: document.getElementById('f-cierre').value + ':00'
      };
      try {
        const res = await fetch('/restaurantes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          e.target.reset();
          cerrarVentana();
          cargar();
        } else {
          errorBox.textContent = 'No se pudo guardar (¿ya existe ese nombre en esa dirección, o el horario es inválido?)';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.textContent = 'No se pudo conectar con el servidor';
        errorBox.classList.remove('hidden');
      }
    });
  }

  cargar();
})();
</script>
</section>
</body>
</html>
