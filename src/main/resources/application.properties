spring.application.name=demo
 
# ─── Conexión a PostgreSQL ─────────────────────────────────────────
# AJUSTEN el puerto, el usuario y la contraseña a su instalación
spring.datasource.url=jdbc:postgresql://localhost:5433/Sabrosometro
spring.datasource.username=postgres
spring.datasource.password=123
 
# ─── Servidor ──────────────────────────────────────────────────────
# 8080 es el puerto por defecto.
server.port=8080
 
# ─── Ver en la consola el SQL que ejecuta JdbcTemplate ─────────────
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0